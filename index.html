<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warm Wood Living Room — 3D Booth Mockup 15 × 3 m</title>
  <meta name="description" content="Interactive 3D mockup of a 15 x 3 m exhibition booth styled as a Warm Wood Living Room showroom with furniture, shelving and 50 cm sculpture displays." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-mark">MT</div>
      <p class="loader-title">Maison Terra</p>
      <p class="loader-sub">กำลังสร้างบูธ 3D…</p>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <main>
    <div id="scene" aria-label="3D booth viewer"></div>



    <!-- Mobile Floating Menu Button -->
    <button id="btnTogglePanel" class="btn-toggle-panel glass" aria-label="Toggle Control Panel">
      <svg class="toggle-icon-gear" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="btn-toggle-label">แผงควบคุม</span>
    </button>

    <!-- Backdrop for mobile drawer -->
    <div id="panelBackdrop" class="panel-backdrop"></div>

    <!-- Control panel -->
    <aside class="panel glass" id="controlPanel">
      <div class="drawer-header">
        <div class="drawer-pill"></div>
        <span class="drawer-title">ตั้งค่า & เมนูควบคุม</span>
        <button id="btnClosePanel" class="drawer-close" aria-label="Close Settings">✕</button>
      </div>
      <h2>บรรยากาศแสง</h2>
      <div class="seg" id="lightModes">
        <button id="mode-golden" data-mode="golden" class="active">Golden Hour</button>
        <button id="mode-day" data-mode="day">Daylight</button>
        <button id="mode-night" data-mode="night">Gallery Night</button>
      </div>

      <h2>การแสดงผล</h2>
      <label class="toggle"><input type="checkbox" id="toggleDims" checked autocomplete="off" /><span class="track"></span>แสดงขนาด (Dimensions)</label>
      <label class="toggle"><input type="checkbox" id="toggleZones" autocomplete="off" /><span class="track"></span>ป้ายชื่อโซน</label>
      <label class="toggle"><input type="checkbox" id="toggleExhibits" autocomplete="off" /><span class="track"></span>จุดจัดแสดง (S1-S6 / P1-P4)</label>
      <label class="toggle"><input type="checkbox" id="toggleTransparent" /><span class="track"></span>ผนังโปร่งใสทะลุ (See-Through / X-Ray)</label>
      <div id="xRayControls" style="display: none; margin: -2px 0 10px 24px; padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: var(--muted);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span>ระดับความจาง:</span>
          <span id="xRayOpacityDisplay" style="color: var(--amber); font-weight: 500;">จางมากพิเศษ (3.5%)</span>
        </div>
        <input type="range" id="xRayOpacitySlider" min="1" max="15" value="3.5" step="0.5" style="width: 100%; accent-color: var(--amber); cursor: pointer;" />
      </div>
      <label class="toggle"><input type="checkbox" id="toggleRotate" /><span class="track"></span>หมุนอัตโนมัติ</label>

      <h2>โมเดล 3D ของคุณ</h2>
      <input type="file" id="fileUpload" accept=".glb,.gltf,.obj,.fbx" style="display:none;" />
      <button class="btn-secondary" id="btnUpload">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0-12l-4 4m4-4l4 4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>
        + นำเข้าไฟล์ 3D (.glb, .fbx, .obj)
      </button>

      <div id="customModelTools" class="custom-tools" style="display: none;">
        <div class="tool-row">
          <label>การปรับตำแหน่ง:</label>
          <div class="seg seg-mini" id="gizmoModes">
            <button id="gizmo-translate" data-mode="translate" class="active">เลื่อน</button>
            <button id="gizmo-rotate" data-mode="rotate">หมุน</button>
          </div>
        </div>
        <div class="tool-row">
          <label>ความสูง:</label>
          <span id="heightDisplay" class="val-badge">50 cm</span>
        </div>
        <div class="tool-slider">
          <input type="range" id="scaleSlider" min="10" max="150" value="50" step="1" />
        </div>
        <div class="preset-btns">
          <button class="btn-chip" id="btnSet50cm">ตั้ง 50 ซม.</button>
          <button class="btn-chip" id="btnPlacePedestal">ย้ายไปแท่นโชว์</button>
        </div>
        <button class="btn-danger" id="btnDeleteModel">ลบโมเดลที่เลือก</button>
      </div>

      <button class="btn-primary" id="btnShot">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        บันทึกภาพ PNG
      </button>
    </aside>

    <!-- Drag & Drop overlay -->
    <div id="dropZone" class="drop-overlay">
      <div class="drop-box">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v12m0-12l-4 4m4-4l4 4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>
        <p>วางไฟล์โมเดล 3D ที่นี่</p>
        <span>รองรับ .GLB, .FBX, .OBJ, .GLTF (ปรับสเกล 50 ซม. ได้ทันที)</span>
      </div>
    </div>



    <!-- Camera views -->
    <nav class="views glass" id="viewBar" aria-label="Camera views">
      <button id="view-overview" data-view="overview" class="active">ภาพรวม</button>
      <button id="view-front" data-view="front">ด้านหน้าตรง</button>
      <button id="view-photospot" data-view="photospot">📸 มุมถ่ายรูป (Sofa)</button>
      <button id="view-entrance" data-view="entrance">🚪 ทางเข้าซ้าย (1.5m)</button>
      <button id="view-window" data-view="window">🪟 ส่องผ่านหน้าต่าง</button>
      <button id="view-exit" data-view="exit">🚪 ทางออกขวา (1.5m)</button>
      <button id="view-walkthrough" data-view="walkthrough">🚶 ทางเดินในห้อง</button>
      <button id="view-room1" data-view="room1">ห้อง 1 · West</button>
      <button id="view-room2" data-view="room2">ห้อง 2 · Center</button>
      <button id="view-room3" data-view="room3">ห้อง 3 · East</button>
      <button id="view-sculptures" data-view="sculptures">6 ประติมากรรม</button>
      <button id="view-paintings" data-view="paintings">4 รูปภาพ</button>
      <button id="view-top" data-view="top">มุมบน (Floor Plan)</button>
    </nav>

    <div class="hint">ลาก: หมุน · Scroll: ซูม · คลิกขวา: เลื่อน</div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
